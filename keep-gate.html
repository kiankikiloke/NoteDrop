<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4f3ef;
    --card: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6a66;
    --accent: #2f7d5f;
    --accent-ink: #ffffff;
    --border: #e4e2db;
    --error: #b0473a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --card: #212226;
      --ink: #f0efe9;
      --muted: #9a9a94;
      --accent: #6fbf9c;
      --accent-ink: #10231c;
      --border: #33343a;
      --error: #e08579;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --card: #212226;
    --ink: #f0efe9;
    --muted: #9a9a94;
    --accent: #6fbf9c;
    --accent-ink: #10231c;
    --border: #33343a;
    --error: #e08579;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100%;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
  }
  .lock {
    font-size: 40px;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 26px;
    line-height: 1.4;
  }
  .code-inputs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .code-inputs input {
    width: 52px;
    height: 60px;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }
  .code-inputs input:focus {
    border-color: var(--accent);
  }
  .code-inputs input.error {
    border-color: var(--error);
    animation: shake 0.3s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:not(:disabled):hover {
    opacity: 0.9;
  }
  .msg {
    min-height: 18px;
    font-size: 13px;
    color: var(--error);
    margin-top: 12px;
  }
  .success {
    color: var(--accent);
  }
  .qr-section {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px dashed var(--border);
  }
  .qr-section p {
    font-size: 12.5px;
    color: var(--muted);
    margin: 10px 0 0;
    line-height: 1.4;
  }
  #qrcode {
    display: flex;
    justify-content: center;
  }
  #qrcode img, #qrcode canvas {
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #ffffff;
    padding: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lock" id="lockIcon">🔒</div>
    <h1>Enter Access Code</h1>
    <p class="sub">Enter the 4-digit code to continue to Google Keep.</p>

    <div class="code-inputs" id="codeInputs">
      <input type="tel" inputmode="numeric" maxlength="1" data-idx="0">
      <input type="tel" inputmode="numeric" maxlength="1" data-idx="1">
      <input type="tel" inputmode="numeric" maxlength="1" data-idx="2">
      <input type="tel" inputmode="numeric" maxlength="1" data-idx="3">
    </div>

    <button id="submitBtn">Unlock</button>
    <div class="msg" id="msg"></div>

    <div class="qr-section">
      <div id="qrcode"></div>
      <p>Scan this QR code to open this same locked page on another device.</p>
    </div>
  </div>

<script>
  var CORRECT_CODE = "1234";
  var DESTINATION = "https://keep.google.com/";

  var inputs = Array.from(document.querySelectorAll('#codeInputs input'));
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');
  var lockIcon = document.getElementById('lockIcon');

  inputs.forEach(function(inp, i) {
    inp.addEventListener('input', function() {
      inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (inp.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
      clearError();
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !inp.value && i > 0) {
        inputs[i - 1].focus();
      }
      if (e.key === 'Enter') {
        attemptUnlock();
      }
    });
    inp.addEventListener('paste', function(e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      for (var j = 0; j < inputs.length; j++) {
        inputs[j].value = text[j] || '';
      }
      var lastFilled = Math.min(text.length, inputs.length) - 1;
      if (lastFilled >= 0) inputs[lastFilled].focus();
    });
  });

  function clearError() {
    inputs.forEach(function(inp) { inp.classList.remove('error'); });
    msg.textContent = '';
    msg.classList.remove('success');
  }

  function attemptUnlock() {
    var code = inputs.map(function(i) { return i.value; }).join('');
    if (code.length < 4) {
      showError('Enter all 4 digits.');
      return;
    }
    btn.disabled = true;
    if (code === CORRECT_CODE) {
      lockIcon.textContent = '🔓';
      msg.textContent = 'Correct — opening Google Keep…';
      msg.classList.add('success');
      setTimeout(function() {
        window.location.href = DESTINATION;
      }, 500);
    } else {
      showError('Incorrect code. Try again.');
      btn.disabled = false;
    }
  }

  function showError(text) {
    msg.textContent = text;
    msg.classList.remove('success');
    inputs.forEach(function(inp) { inp.classList.add('error'); });
    setTimeout(function() {
      inputs.forEach(function(inp) { inp.classList.remove('error'); });
    }, 300);
  }

  btn.addEventListener('click', attemptUnlock);
  inputs[0].focus();

  // QR code: encodes this page's own published URL so it can be scanned
  // to reach this same locked gate from another device.
  try {
    var selfUrl = window.location.href.split('#')[0];
    if (window.QRCode && selfUrl && selfUrl.indexOf('http') === 0) {
      new QRCode(document.getElementById('qrcode'), {
        text: selfUrl,
        width: 160,
        height: 160,
        colorDark: '#1c1c1a',
        colorLight: '#ffffff'
      });
    } else {
      document.querySelector('.qr-section').style.display = 'none';
    }
  } catch (e) {
    document.querySelector('.qr-section').style.display = 'none';
  }
</script>
</body>
</html>
